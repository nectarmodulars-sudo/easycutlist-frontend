<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EasyCutList — Custom plan links</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1E0F21;color:#fff;font-family:'Lato',system-ui,sans-serif}
header{background:#2A0A2C;height:48px;padding:0 14px;display:flex;align-items:center;gap:8px}
.logo-i{width:22px;height:22px;border-radius:5px;background:#ECB22E;display:grid;place-items:center}
.brand{font-size:15px;font-weight:900}.brand span{color:#ECB22E}
#who{margin-left:auto;font-size:11px;color:#CDBFCF;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:#2A0A2C;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;font-weight:900}
h2{margin:0;font-size:15px;font-weight:900;color:#ECB22E}
label,.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#CDBFCF}
input,select{height:46px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:#1A0B1C;color:#fff;font-family:inherit;font-size:16px;width:100%}
input:focus,select:focus{outline:2px solid #ECB22E;outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden;flex:1}
.seg button{flex:1;height:46px;border:0;background:transparent;color:#E6DDE7;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
.seg button[aria-pressed="true"]{background:#ECB22E;color:#2A0A2C}
.hint{font-size:12px;color:#BFAFC2;font-weight:400}
.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;font-weight:400;color:#E6DDE7}
.chk input{width:20px;height:20px;accent-color:#ECB22E}
.btn{height:50px;border-radius:10px;border:0;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn-y{background:#ECB22E;color:#2A0A2C}.btn-y:disabled{opacity:.6}
.btn-wa{background:#25D366;color:#06311A}
.btn-o{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
.btn-g{background:#fff;color:#1F1A22}
.ok{border-color:#3E8E66;background:rgba(46,182,125,.12)}
.err{color:#FF9BB5;font-size:13px}
.link{font-family:monospace;font-size:12px;word-break:break-all;background:#1A0B1C;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px}
.item{border-top:1px solid rgba(255,255,255,.1);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.item:first-child{border-top:0;padding-top:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:900}.em{font-size:12px;color:#BFAFC2;word-break:break-all}
.meta{font-size:13px;color:#E6DDE7}
.badge{font-size:10px;font-weight:900;padding:3px 7px;border-radius:4px;white-space:nowrap}
.b-paid{background:#1E5C3E;color:#B8F0D2}.b-pending{background:#5A4210;color:#FFE3A3}.b-expired{background:#3A3D42;color:#ddd}.b-cancelled{background:#4A2030;color:#F3C2CF}
.acts{display:flex;gap:8px}.acts .btn{height:40px;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo-i" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2A0A2C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div>
  <span class="brand">Easy<span>CutList</span> · Plan links</span>
  <span id="who"></span>
</header>

<main>
  <section class="card" id="v-load"><span class="hint">Loading…</span></section>

  <section class="card" id="v-login" hidden>
    <h1>Sign in</h1>
    <p class="hint" style="margin:0">Only admin Google accounts can create plan links.</p>
    <button class="btn btn-g" id="btn-login" type="button">Sign in with Google</button>
  </section>

  <section class="card" id="v-denied" hidden>
    <h1>Not allowed</h1>
    <p class="hint" style="margin:0">This Google account is not an admin.</p>
    <button class="btn btn-o" id="btn-switch" type="button">Use another account</button>
  </section>

  <div id="v-app" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="card" aria-labelledby="new-h">
      <h2 id="new-h">New ASM Pro plan link</h2>
      <label>Client name<input id="f-name" autocomplete="off" placeholder="e.g. Shree Ram Kitchens"></label>
      <label>Client WhatsApp number<input id="f-phone" type="tel" inputmode="tel" placeholder="+91 98xxx xxxxx"></label>
      <label>Client Google email (plan goes to this login)<input id="f-email" type="email" inputmode="email" autocapitalize="off" placeholder="client@gmail.com"></label>
      <div class="lbl">Duration
        <div style="display:flex;gap:8px">
          <input id="f-dur" type="number" inputmode="numeric" min="1" value="30" aria-label="Duration number" style="width:90px;text-align:right">
          <div class="seg" role="group" aria-label="Duration unit">
            <button type="button" data-u="days" aria-pressed="true">Days</button>
            <button type="button" data-u="months" aria-pressed="false">Months</button>
            <button type="button" data-u="years" aria-pressed="false">Years</button>
          </div>
        </div>
        <span class="hint" id="f-end"></span>
      </div>
      <div class="row2">
        <label>Amount (₹)<input id="f-amt" type="number" inputmode="decimal" min="1" placeholder="9000" style="text-align:right"></label>
        <label>Link valid for<select id="f-valid"><option value="3">3 days</option><option value="7" selected>7 days</option><option value="15">15 days</option><option value="30">30 days</option></select></label>
      </div>
      <label class="chk"><input type="checkbox" id="f-gst" checked> Amount includes GST</label>
      <label>Note for client (optional)<input id="f-note" maxlength="300" placeholder="e.g. Includes setup of your standards"></label>
      <button class="btn btn-y" id="btn-create" type="button">Create payment link</button>
      <span class="err" id="f-err" role="alert"></span>
    </section>

    <section class="card ok" id="v-result" hidden aria-live="polite">
      <h2 style="color:#8EE3B9">Link ready — send it</h2>
      <div class="link" id="r-url"></div>
      <a class="btn btn-wa" id="r-wa" target="_blank" rel="noopener">Send on WhatsApp</a>
      <div class="row2">
        <button class="btn btn-o" id="r-copy" type="button">Copy link</button>
        <button class="btn btn-o" id="r-share" type="button">Share…</button>
      </div>
    </section>

    <section class="card" aria-labelledby="list-h">
      <div class="top"><h2 id="list-h">Sent links</h2><button class="btn btn-o" id="btn-refresh" type="button" style="width:auto;height:34px;padding:0 12px;font-size:12px">Refresh</button></div>
      <div id="list"><span class="hint">Loading…</span></div>
    </section>

    <button class="btn btn-o" id="btn-logout" type="button">Sign out</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : 'https://api.easycutlist.com';
  var supa = window.supabase.createClient('https://reklrjwsvgtrliksodwu.supabase.co', 'sb_publishable_nRwWXeWmRPKs6WqjPBm57w_MjfCP4zw', {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
  });
  var $ = function (x) { return document.getElementById(x); };
  var unit = 'days', token = null, last = null;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (d) { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); };
  var unitWord = function (n, u) { return n + ' ' + (n == 1 ? u.replace(/s$/, '') : u); };

  function view(v) { ['v-load', 'v-login', 'v-denied', 'v-app'].forEach(function (x) { $(x).hidden = x !== v; }); }
  function api(path, body) {
    return fetch(API + path, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ 'Authorization': 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); });
  }
  function login() { supa.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } }); }
  $('btn-login').onclick = login;
  $('btn-switch').onclick = function () { supa.auth.signOut().then(login); };
  $('btn-logout').onclick = function () { supa.auth.signOut().then(function () { location.reload(); }); };

  // duration unit + end-date hint
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.onclick = function () {
      unit = b.getAttribute('data-u');
      document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      endHint();
    };
  });
  function endHint() {
    var n = parseInt($('f-dur').value, 10) || 0, d = new Date();
    if (n <= 0) { $('f-end').textContent = ''; return; }
    if (unit === 'days') d.setDate(d.getDate() + n); else if (unit === 'years') d.setFullYear(d.getFullYear() + n); else d.setMonth(d.getMonth() + n);
    $('f-end').textContent = 'Starts on payment. If paid today, ends ' + fmt(d) + '.';
  }
  $('f-dur').oninput = endHint; endHint();

  function waUrl(url, phone, name, dur, amt) {
    var text = 'Hi' + (name ? ' ' + name : '') + ', here is your EasyCutList Cutlist Builder (ASM) Pro plan — ' + dur + ' for ₹' + Number(amt).toLocaleString('en-IN') +
      '. Please sign in with your Google account and pay here: ' + url;
    var p = String(phone || '').replace(/[^\d]/g, '');
    if (p.length === 10) p = '91' + p;          // Indian number typed without code
    return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text);
  }

  $('btn-create').onclick = function () {
    var btn = this; $('f-err').textContent = '';
    var body = {
      client_name: $('f-name').value, client_phone: $('f-phone').value, client_email: $('f-email').value,
      duration_value: $('f-dur').value, duration_unit: unit, amount: $('f-amt').value,
      link_valid_days: $('f-valid').value, gst_included: $('f-gst').checked, note: $('f-note').value
    };
    btn.disabled = true; btn.textContent = 'Creating…';
    api('/asm/custom-admin/create', body).then(function (d) {
      btn.disabled = false; btn.textContent = 'Create payment link';
      if (!d.success) { $('f-err').textContent = d.error === 'not_admin' ? 'This account is not an admin.' : (d.error || 'Failed'); return; }
      last = { url: d.url, text: waUrl(d.url, body.client_phone, body.client_name, unitWord(body.duration_value, unit), body.amount) };
      $('r-url').textContent = d.url;
      $('r-wa').href = last.text;
      $('r-wa').hidden = !String(body.client_phone || '').replace(/[^\d]/g, '');
      $('v-result').hidden = false;
      $('v-result').scrollIntoView({ behavior: 'smooth', block: 'center' });
      ['f-name', 'f-phone', 'f-email', 'f-amt', 'f-note'].forEach(function (i) { $(i).value = ''; });
      loadList();
    }).catch(function () { btn.disabled = false; btn.textContent = 'Create payment link'; $('f-err').textContent = 'Network error — try again.'; });
  };
  function copy(t, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); } };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done); else done();
  }
  $('r-copy').onclick = function () { if (last) copy(last.url, this); };
  $('r-share').onclick = function () { if (last && navigator.share) navigator.share({ title: 'EasyCutList plan', url: last.url }).catch(function () {}); else if (last) copy(last.url, this); };

  function loadList() {
    api('/asm/custom-admin/links').then(function (d) {
      if (!d.success) { $('list').innerHTML = '<span class="err">' + esc(d.error || 'Failed') + '</span>'; return; }
      if (!d.links.length) { $('list').innerHTML = '<span class="hint">No links yet</span>'; return; }
      $('list').innerHTML = d.links.map(function (l) {
        var url = d.payPage + '?id=' + l.id;
        var info = l.status === 'paid' ? 'Paid ' + fmt(l.paid_at) + ' · active till ' + fmt(l.plan_expires_at)
          : l.status === 'pending' ? 'Link valid till ' + fmt(l.link_expires_at) : 'Created ' + fmt(l.created_at);
        var acts = l.status === 'pending'
          ? '<div class="acts"><button class="btn btn-o" data-copy="' + esc(url) + '">Copy link</button><button class="btn btn-o" data-cancel="' + esc(l.id) + '" style="border-color:#E01E5A;color:#FF9BB5">Cancel</button></div>' : '';
        return '<div class="item"><div class="top"><div><div class="nm">' + esc(l.client_name || '—') + '</div><div class="em">' + esc(l.client_email) + '</div></div>' +
          '<span class="badge b-' + esc(l.status) + '">' + esc(String(l.status).toUpperCase()) + '</span></div>' +
          '<div class="meta">' + esc(unitWord(l.duration_value, l.duration_unit)) + ' · ₹' + esc(Number(l.amount).toLocaleString('en-IN')) + '</div>' +
          '<div class="hint">' + esc(info) + '</div>' + acts + '</div>';
      }).join('');
      $('list').querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { copy(b.getAttribute('data-copy'), b); }; });
      $('list').querySelectorAll('[data-cancel]').forEach(function (b) {
        b.onclick = function () {
          if (!confirm('Cancel this link? The client will not be able to pay with it.')) return;
          api('/asm/custom-admin/cancel', { id: b.getAttribute('data-cancel') }).then(loadList);
        };
      });
    }).catch(function () { $('list').innerHTML = '<span class="err">Network error</span>'; });
  }
  $('btn-refresh').onclick = loadList;

  async function start() {
    var s = (await supa.auth.getSession()).data.session;
    if (!s) { $('who').textContent = ''; return view('v-login'); }
    token = s.access_token; $('who').textContent = s.user.email || '';
    try {
      var me = await api('/asm/custom-admin/me');
      if (!me.admin) return view('v-denied');
    } catch (e) { return view('v-login'); }
    view('v-app'); loadList();
  }
  supa.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_IN' || ev === 'TOKEN_REFRESHED') start(); });
  start();
})();
</script>
</body>
</html>
